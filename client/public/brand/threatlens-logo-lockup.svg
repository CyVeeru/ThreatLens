<svg xmlns="http://www.w3.org/2000/svg" width="430" height="104" viewBox="0 0 430 104" role="img" aria-label="ThreatLens">
  <title>ThreatLens</title>
  <defs>
    <linearGradient id="tlBadge" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#10B981"/>
      <stop offset="1" stop-color="#0B6B53"/>
    </linearGradient>
  </defs>
  <g transform="translate(16 16) scale(1.12500)">
    <rect width="64" height="64" rx="15" fill="url(#tlBadge)"/>
    
      <!-- Iris: six blades stopped down to a hexagonal opening. -->
      <path d="M 13 32 A 19 19 0 1 1 51 32 A 19 19 0 1 1 13 32 Z M 39.6 36.388 L 32 40.776 L 24.4 36.388 L 24.4 27.612 L 32 23.224 L 39.6 27.612 Z" fill="#FFFFFF" fill-rule="evenodd"/>
    
      <!-- Blade seams, offset tangentially the way overlapping blades sit. -->
      <g stroke="url(#tlBadge)" stroke-width="2" stroke-linecap="butt">
        <path d="M 39.6 36.388 L 39.6 49.414"/>
        <path d="M 32 40.776 L 20.719 47.289"/>
        <path d="M 24.4 36.388 L 13.119 29.875"/>
        <path d="M 24.4 27.612 L 24.4 14.586"/>
        <path d="M 32 23.224 L 43.281 16.711"/>
        <path d="M 39.6 27.612 L 50.881 34.125"/>
      </g>
    
      <!-- Focal point: the one verified finding the lens resolves. -->
      <circle cx="32" cy="32" r="4.2" fill="#F59E0B"/>
  </g>
  <g font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif">
    <text x="110" y="56" font-size="42" font-weight="700" letter-spacing="-1" fill="#0F172A">Threat<tspan fill="#0B7A5E">Lens</tspan></text>
    <text x="112" y="80" font-size="12" font-weight="600" letter-spacing="3.2" fill="#64748B">EVIDENCE-LED THREAT OPERATIONS</text>
  </g>
</svg>
