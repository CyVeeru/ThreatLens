name: Code Quality and Release

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  quality:
    name: Quality on Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - "20.x"
          - "22.x"

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run code-quality checks
        run: npm run check

      - name: Build production bundle
        run: npm run build

  snyk:
    name: Snyk dependency security
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22.x"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check Snyk token
        id: snyk-token
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          set -euo pipefail

          if [ -n "${SNYK_TOKEN}" ]; then
            echo "available=true" >> "${GITHUB_OUTPUT}"
          else
            echo "available=false" >> "${GITHUB_OUTPUT}"
            echo "SNYK_TOKEN is not configured; skipping Snyk scans."
          fi

      - name: Run Snyk dependency scan
        if: steps.snyk-token.outputs.available == 'true'
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: npx -y snyk test --file=package-lock.json --package-manager=npm

  release:
    name: Build release archive
    needs:
      - quality
      - snyk
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22.x"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        run: npm run build

      - name: Prepare release directory
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          RELEASE_NAME="threatlens-${RELEASE_TAG}"
          RELEASE_DIR="release/${RELEASE_NAME}"

          mkdir -p "${RELEASE_DIR}"
          cp -R dist "${RELEASE_DIR}/dist"
          mkdir -p "${RELEASE_DIR}/data"
          cp -R data/public "${RELEASE_DIR}/data/public"
          if [ -d data/secrets ]; then
            mkdir -p "${RELEASE_DIR}/data/secrets"
            cp data/secrets/*.template.db "${RELEASE_DIR}/data/secrets/" 2>/dev/null || true
          fi
          cp -R scripts "${RELEASE_DIR}/scripts"
          cp package.json package-lock.json .env.example "${RELEASE_DIR}/"
          cp README.md LICENSE SECURITY.md VERIFYING.md DEPLOYMENT.md CONTRIBUTING.md ARCHITECTURE.md "${RELEASE_DIR}/"

          if [ -d signing/keys ]; then
            mkdir -p "${RELEASE_DIR}/signing/keys"
            cp signing/keys/*.asc "${RELEASE_DIR}/signing/keys/"
          fi

          cat > "${RELEASE_DIR}/RUNNING_RELEASE.md" <<'EOF'
          # Running a ThreatLens release archive

          ```bash
          npm ci --omit=dev
          npm run db:restore-public
          npm start
          ```

          Then open `http://localhost:7099`.

          Configure your own AI provider keys in AI Settings after first login.
          EOF

          tar -czf "release/${RELEASE_NAME}.tar.gz" -C release "${RELEASE_NAME}"
          sha256sum "release/${RELEASE_NAME}.tar.gz" > release/SHA256SUMS

      - name: Sign release assets (only when signing secrets exist)
        env:
          GPG_PRIVATE_KEY: ${{ secrets.THREATLENS_RELEASE_GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.THREATLENS_RELEASE_GPG_PASSPHRASE }}
        run: |
          set -euo pipefail

          if [ -z "${GPG_PRIVATE_KEY}" ] || [ -z "${GPG_PASSPHRASE}" ]; then
            echo "Signing secrets not configured; publishing unsigned release with SHA256SUMS only."
            exit 0
          fi

          printf '%s' "${GPG_PRIVATE_KEY}" | gpg --batch --import

          for artifact in release/*.tar.gz release/SHA256SUMS; do
            gpg --batch --yes --pinentry-mode loopback \
              --passphrase "${GPG_PASSPHRASE}" \
              --armor --detach-sign "${artifact}"
          done

      - name: Upload release build artifact
        uses: actions/upload-artifact@v4
        with:
          name: threatlens-${{ github.ref_name }}
          path: |
            release/*.tar.gz
            release/SHA256SUMS
            release/*.asc
          if-no-files-found: error

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          files=(release/*.tar.gz release/SHA256SUMS)
          for sig in release/*.asc; do
            [ -e "${sig}" ] && files+=("${sig}")
          done
          gh release create "${GITHUB_REF_NAME}" "${files[@]}" \
            --title "ThreatLens ${GITHUB_REF_NAME}" \
            --notes-file RELEASE_NOTES.md
